name: Build (Windows)

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm i --loglevel error
      - run: npm run types
      - run: npx mocha
      - run: npm run test:md
